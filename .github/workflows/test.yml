name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      # go.mod points at the sibling proto module (the shared claims
      # contract) with a replace directive until it is published, so both
      # repos are checked out side by side — same layout as a local clone.
      - uses: actions/checkout@v4
        with:
          path: auth
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/proto
          path: proto
      - uses: actions/setup-go@v5
        with:
          go-version-file: auth/go.mod
      - run: go test ./...
        working-directory: auth
